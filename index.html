<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Protected Maintenance Page">
<title>Protected Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:#fff;
    color:#1a1a1a;
}

/* Login Screen */

#login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:360px;
    background:#fff;
    border:1px solid #eee;
    border-radius:16px;
    padding:30px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.card h2{
    text-align:center;
    margin-bottom:8px;
}

.card p{
    text-align:center;
    color:#666;
    margin-bottom:22px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
    margin-bottom:16px;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#msg{
    margin-top:14px;
    text-align:center;
    font-size:14px;
    color:#dc2626;
}

/* Maintenance Page */

#maintenance{
    display:none;
    width:100%;
    min-height:100vh;
    align-items:center;
    justify-content:center;
}

.container{
    text-align:center;
    padding:40px 20px;
    max-width:550px;
    animation:fadeIn .8s ease-out;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

.icon{
    font-size:56px;
    margin-bottom:32px;
    opacity:.8;
}

h1{
    font-size:42px;
    font-weight:700;
    margin-bottom:16px;
    letter-spacing:-.5px;
}

.subtitle{
    font-size:18px;
    color:#666;
    margin-bottom:24px;
    line-height:1.5;
}

.description{
    font-size:15px;
    color:#888;
    line-height:1.7;
}

.divider{
    margin:48px 0;
    height:1px;
    background:#f0f0f0;
}

.author-name{
    font-weight:600;
    font-size:15px;
}

@media(max-width:600px){
    h1{font-size:32px;}
    .subtitle{font-size:16px;}
    .icon{font-size:48px;}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
    <div class="card">
        <h2>🔒 Protected Page</h2>
        <p>Enter password to continue</p>

        <input type="password" id="password" placeholder="Password" autofocus>

        <button onclick="login()">Continue</button>

        <div id="msg"></div>
    </div>
</div>

<!-- MAINTENANCE PAGE -->
<div id="maintenance">
    <div class="container">
        <div class="icon">⚙️</div>

        <h1>Under Maintenance</h1>
        <p class="subtitle">We're working on something new</p>

        <p class="description">
            Our website is currently undergoing maintenance.
        </p>

        <div class="divider"></div>

        <div class="footer">
            <p class="author-name">Aman K. Thakur</p>
        </div>
    </div>
</div>

<script>
// SHA-256 hash of "amankumarthakurA9_"
const PASSWORD_HASH = "e390ae4664fef48f0dae9bf3ebb2b921b1eb7d59e98b188d3557dc91bdb6bcb8";

async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(hash)]
        .map(b=>b.toString(16).padStart(2,"0"))
        .join("");
}

async function login(){
    const password = document.getElementById("password").value;
    const hash = await sha256(password);
    const msg = document.getElementById("msg");

    if(hash === PASSWORD_HASH){
        document.getElementById("login").style.display = "none";
        document.getElementById("maintenance").style.display = "flex";
    }else{
        msg.textContent = "Incorrect Password";
    }
}

document.getElementById("password").addEventListener("keydown",function(e){
    if(e.key==="Enter"){
        login();
    }
});
</script>

</body>
</html>

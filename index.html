<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site under maintenance. We'll be back shortly.">
    <title>Under Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 550px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .icon {
            font-size: 56px;
            margin-bottom: 32px;
            opacity: 0.8;
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 18px;
            color: #666666;
            margin-bottom: 24px;
            line-height: 1.5;
            font-weight: 400;
        }

        .description {
            font-size: 15px;
            color: #888888;
            margin-bottom: 36px;
            line-height: 1.7;
        }

        .cta-button {
            display: inline-block;
            padding: 12px 28px;
            background: #1a1a1a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            margin-top: 12px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            background: #333333;
        }

        .cta-button:active {
            transform: scale(0.98);
        }

        .divider {
            margin: 48px 0;
            height: 1px;
            background: #f0f0f0;
        }

        .footer {
            padding-top: 20px;
        }

        .author-name {
            font-weight: 600;
            color: #1a1a1a;
            font-size: 15px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-top: 20px;
        }

        .social-link {
            color: #888888;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .social-link:hover {
            color: #1a1a1a;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
            }

            .icon {
                font-size: 48px;
            }

            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚙️</div>

        <h1>Under Maintenance</h1>
        <p class="subtitle">We're working on something new</p>

        <p class="description">
            Our website is currently undergoing maintenance.
        </p>

        <div class="divider"></div>

        <div class="footer">
            <p class="author-name">Aman K. Thakur</p>
        </div>
    </div>
</body>
</html>
